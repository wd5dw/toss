<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>5천원 지급 이벤트</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1e40af;
      --bg: #f0f6ff;
      --card: #ffffff;
      --text-main: #0f172a;
      --text-sub: #475569;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: linear-gradient(180deg, #eaf2ff, #f8fbff);
      color: var(--text-main);
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    .hero {
      text-align: center;
      margin-bottom: 48px;
    }

    .hero h1 {
      font-size: clamp(2rem, 4vw, 2.8rem);
      margin-bottom: 12px;
      font-weight: 800;
    }

    .hero .highlight {
      color: var(--primary);
    }

    .hero p {
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      color: var(--text-sub);
      line-height: 1.6;
    }

    .card {
      background: var(--card);
      border-radius: 20px;
      padding: clamp(24px, 4vw, 40px);
      box-shadow: 0 20px 40px rgba(37, 99, 235, 0.15);
    }

    .card h2 {
      font-size: 1.6rem;
      margin-bottom: 12px;
      text-align: center;
    }

    .benefit {
      text-align: center;
      font-size: 1.1rem;
      color: var(--text-sub);
      margin-bottom: 32px;
    }

    .benefit strong {
      color: var(--primary);
      font-size: 1.4rem;
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 24px;
    }

    .step {
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .step:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.08);
    }

    .step-number {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .step p {
      margin: 0;
      color: var(--text-sub);
    }

    .cta {
      margin-top: 40px;
      text-align: center;
    }

    .cta button {
      width: 100%;
      max-width: 360px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 18px 24px;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
    }

    .cta button:hover {
      opacity: 0.95;
    }

    .note {
      margin-top: 14px;
      text-align: center;
      font-size: 0.9rem;
      color: #64748b;
    }

    @media (max-width: 480px) {
      .container {
        padding: 32px 16px 64px;
      }
    }
  
    .header {
      width: 100%;
      background: transparent;
      padding: 20px 0;
    }

    .header-inner {
      max-width: 100%;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      align-items: center;
    }

    .logo {
      height: 32px;
      width: auto;
      margin-left: 4px;
    }

    @media (max-width: 480px) {
      .logo {
        height: 26px;
      }
    }
  
    .live-count {
      margin-top: 16px;
      font-size: clamp(1.1rem, 2.5vw, 1.35rem);
      color: var(--primary-dark);
      font-weight: 700;
      background: rgba(37, 99, 235, 0.08);
      display: inline-block;
      padding: 10px 18px;
      border-radius: 999px;
      box-shadow: inset 0 0 0 1px rgba(37, 99, 235, 0.15);
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <img src="logo.png" alt="토스 로고" class="logo" />
    </div>
  </header>
  <div class="container">
    <section class="hero">
      <div class="live-count" id="liveCount">7384명이 참여중이에요!</div>
      <h1>간단하게 <span class="highlight">5천원</span> 받아가세요</h1>
      <p>
        복잡한 조건 없이<br />
        누구나 참여 가능한 푸른빛 혜택 이벤트
      </p>
    </section>

    <section class="card">
      <h2>이벤트 안내</h2>
      <div class="benefit">
        참여만 해도 <strong>30,000원</strong> 지급<br />
        전체 절차는 1분 이내로 끝납니다
      </div>

      <div class="steps">
        <div class="step">
          <div class="step-number">1</div>
          <p>간단한 정보 입력</p>
        </div>
        <div class="step">
          <div class="step-number">2</div>
          <p>참여 버튼 클릭</p>
        </div>
        <div class="step">
          <div class="step-number">3</div>
          <p>5천원 지급 완료</p>
        </div>
      </div>

      <div class="cta">
        <button>지금 바로 참여하기</button>
      </div>
      <div class="note">
        * 모바일 · PC 모두 최적화된 화면으로 제공됩니다
      </div>
    </section>
  </div>
  <script>
    let count = localStorage.getItem('liveCount')
      ? parseInt(localStorage.getItem('liveCount'), 10)
      : 7384;
    const el = document.getElementById('liveCount');
    el.textContent = `${count.toLocaleString()}명이 참여중이에요!`;

    function updateCount() {
      const increase = Math.floor(Math.random() * 3) + 1; // 1~3 랜덤 증가
      count += increase;
            el.textContent = `${count.toLocaleString()}명이 참여중이에요!`;
      localStorage.setItem('liveCount', count); `${count}명이 참여중이에요!`;
    }

    setInterval(updateCount, 2000);
  </script>
</body>
</html>
